name: theirstack

# Market-wide second source on a SLOW cadence — TheirStack bills 1 API credit per job returned
# (free tier: 200/month), so the fetch is incremental (discovered_at watermark) and this schedule
# is deliberately sparse. The 30-min ATS poll workflow is separate and unaffected.
on:
  schedule:
    # Once daily on the FREE tier (200 credits/month) — 11:00 UTC = 14:00 Israel in summer
    # (IDT = UTC+3). GitHub cron is UTC-only and can't follow DST, so in winter (IST = UTC+2) this
    # fires at 13:00 Israel. Cadence barely affects spend (the discovered_at watermark bills each
    # job about once however often we run) — it's the free tier's monthly cap that forces the pace.
    # NOTE: :00 is GitHub's most contended cron slot and scheduled runs there are dropped most
    # often. With only ONE run a day a dropped slot costs a whole day, so if TheirStack starts
    # going missing, move this to an odd minute (e.g. '7 11 * * 0-5').
    - cron: '0 11 * * 0-5' # Sun–Fri, 14:00 Israel (once daily; Saturday: no run)
  workflow_dispatch: {} # manual trigger for testing / a fresh backfill

concurrency:
  group: theirstack
  cancel-in-progress: false

jobs:
  theirstack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level env: config validation loads the full schema on import, so every step that runs
    # our code (migrate as well as poll) needs all vars, not just the ones it appears to use.
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SCORE_THRESHOLD: ${{ secrets.SCORE_THRESHOLD }}
      SCORER: ${{ vars.SCORER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Missing key => the run is a clear no-op (exit 0), never a failure.
      THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Run one TheirStack cycle
        run: npm run poll:theirstack
